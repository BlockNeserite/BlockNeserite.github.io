<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Through The Screen - 3D Eye Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #0a0a0a;
            color: #fff;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #video {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 150px;
            border: 2px solid #00ff88;
            border-radius: 8px;
            transform: scaleX(-1);
            z-index: 10;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .info-item {
            margin: 5px 0;
        }

        .status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status.active {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .status.inactive {
            background: #ff4444;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00ff88;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 10;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 200px;
        }

        .slider-label {
            font-size: 12px;
            color: #00ff88;
            text-align: center;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #00ff88;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #00ff88;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
        }

        button {
            background: #00ff88;
            border: none;
            color: #0a0a0a;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin: 0 5px;
        }

        button:hover {
            background: #00cc6a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 600px) {
            #video {
                top: 8px;
                right: 8px;
                width: 112px;
                height: 84px;
            }

            #info {
                top: 100px;
                left: 8px;
                padding: 8px 10px;
                font-size: 11px;
                max-width: 145px;
            }

            #controls {
                bottom: max(10px, env(safe-area-inset-bottom));
                width: calc(100% - 16px);
                padding: 10px;
                gap: 8px;
                border-radius: 12px;
            }

            #controls button {
                flex: 1 1 42%;
                min-height: 42px;
                margin: 0;
                padding: 8px 10px;
                font-size: 12px;
            }

            .slider-container {
                flex: 1 1 100%;
                min-width: 0;
                order: 10;
            }

            #loading {
                width: calc(100% - 40px);
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        <video id="video" autoplay playsinline></video>

        <div id="info">
            <div class="info-item">
                <span class="status inactive" id="cameraStatus"></span>
                <span>Камера</span>
            </div>
            <div class="info-item">
                <span class="status inactive" id="trackingStatus"></span>
                <span>Отслеживание</span>
            </div>
            <div class="info-item">Дистанция: <span id="distance">-</span> см</div>
            <div class="info-item">X: <span id="posX">-</span></div>
            <div class="info-item">Y: <span id="posY">-</span></div>
            <div class="info-item">FPS: <span id="fps">0</span></div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <p>Загрузка моделей распознавания лиц...</p>
        </div>

        <div id="controls">
            <button id="startBtn" disabled>Запустить отслеживание</button>
            <button id="calibrateBtn" disabled>Калибровка</button>
            <button id="toggleVideoBtn">Скрыть видео</button>

            <div class="slider-container">
                <div class="slider-label">Скорость движения: <span id="parallaxValue">1.0</span>x</div>
                <input type="range" id="parallaxSlider" min="0" max="3" step="0.1" value="1.0">
            </div>

            <button id="invertBtn">Инвертировать оси</button>
        </div>
    </div>

    <!-- Библиотеки и модели находятся в архиве, поэтому не зависят от CDN. -->
    <script src="vendor/three.min.js"></script>
    <script src="vendor/face-api.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
